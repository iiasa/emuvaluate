[project]
authors = [
    { name = "Annika Högner",    email = "hoegner@iiasa.ac.at" },
    { name = "Verena Kain",      email = "kain@iiasa.ac.at" },
    { name = "Tessa Möller",     email = "moeller@iiasa.ac.at" },
    { name = "Zebedee Nicholls", email = "nicholls@iiasa.ac.at" },
    { name = "Niklas Schwind",   email = "schwind@iiasa.ac.at" },
    { name = "Marco Zecchetto",  email = "zecchetto@iiasa.ac.at" },
]
requires-python = ">=3.9"
dependencies = [
    "pre-commit>=3.3.1",
    "jupyterlab>=4.0.0",
    "jupytext>=1.15.2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "properscoring>=0.1",
    "scikit-learn>=1.3",
    "xarray>=2023.1",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "regionmask>=0.12.1",
    "cartopy>=0.23.0",
]
name = "emuvaluate"
version = "0.1.0"
description = "Evaluation and calibration pipeline for climate emulators"
readme = "README.md"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = []
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
